<!DOCTYPE html>
<html lang="en">
<head>
    <link rel = "stylesheet" href = "style.css"/>
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <title>cozy corner</title>
    <link rel="icon" type="image/jpeg" href="/cozyicon.jpeg">
</head>
<body>
    <div class="header">
        <h1 class="CC">cozy corner</h1>
        <p id="welcome">welcome to cheyauna's cozy corner</p>
    </div>
    <form id = "player-form">
        <label for="player-name">Player name:</label>
        <input
                type = "text"
                id = "player-name"
                name = "name"
                placeholder = "enter your name"
                required
        >
        <label for = "start-collection">Favourite starting collection:</label>
        <select id = "starting-collection" name = "collection" required>
            <option value = "">choose a collection</option>
            <option value = "matcha">matcha</option>
        </select>
        <button type = "submit">start game</button>
        <p id = "player-error"></p>
    </form>
    <!-- loading msg -->
    <p id = "loading-msg" hidden>loading cheyauna's cozy corner...</p>
    <!--game hidden until setup is complete-->
    <div id = "game-screen" hidden>

        <div id = "no-energy-msg"></div>
        <div id = "board-full-msg"></div>
        <div class = "grid-container"></div>
        <div id ="export-collection" type = "button">export collection</div>
        <div class = resources></div>`
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/2koBrr8dBzeCNkuWOIYAsq?utm_source=generator&si=47723bd0d24247b4" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>    </div>
